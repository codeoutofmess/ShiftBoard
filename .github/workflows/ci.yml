name: CI

on:
  push:
  pull_request:

# Read-only token: CI only needs to read the code.
permissions:
  contents: read

# New push to the same branch/PR cancels the older run. Never cancel on main:
# Render's "after CI checks pass" needs a final result for every main commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore ShiftBoard.sln
      - run: dotnet build ShiftBoard.sln --configuration Release --no-restore
      - run: dotnet test ShiftBoard.sln --configuration Release --no-build

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ShiftBoard.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ShiftBoard.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
